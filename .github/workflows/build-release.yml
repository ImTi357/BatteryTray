name: Build and Package BatteryTray

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish standalone executable
        run: dotnet publish BatteryTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "Installer\BatteryTray.iss"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BatteryTray-Windows-x64
          path: |
            bin/Release/**/win-x64/publish/BatteryTray.exe
            Installer/BatteryTray_Setup_*.exe
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/Release/**/win-x64/publish/BatteryTray.exe
            Installer/BatteryTray_Setup_*.exe
